<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ================= META ================= -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Level 2 Task 1 - Responsive card component created using Bulma framework for Cognifyz Internship.">
  <meta name="author" content="Sanjai">
  <meta name="keywords" content="Bulma, Responsive Card, Cognifyz Internship, Web Development">
  <meta name="robots" content="index, follow">

  <!-- ================= TITLE ================= -->
  <title>Level 2 Task 1 | Bulma Responsive Card</title>

  <!-- ================= BULMA CSS ================= -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"
  >
</head>

<body>

<section class="section">
  <div class="container">
    <!-- ================= HEADER ================= -->
    <header class="has-text-centered mb-5">
      <h1 class="title">Bulma Responsive Card</h1>
      <p class="subtitle is-6 has-text-grey">
        This example demonstrates a responsive card layout built using the Bulma CSS framework.
      </p>

      <!-- Optional visual enhancement -->
      <figure class="image is-inline-block mt-3" style="max-width: 420px;">
        <img
          src="../../assets/images/project-card.svg"
          alt="Bulma card component preview"
          loading="lazy"
        >
      </figure>
    </header>

    <!-- ================= CARD ================= -->
    <div class="columns is-centered">
      <div class="column is-4">
        <div class="card">
          <div class="card-image">
            <figure class="image is-4by3">
              <img
                src="../../assets/images/project-card.svg"
                alt="Internship project card example"
              >
            </figure>
          </div>

          <div class="card-content">
            <p class="title is-5">Internship Project</p>
            <p class="content">
              This card is created using the Bulma framework. It is fully responsive
              and automatically adapts its layout for mobile, tablet, and desktop screens.
            </p>
          </div>
        </div>
      </div>
    </div>

  </div>
</section>

</body>
</html>
